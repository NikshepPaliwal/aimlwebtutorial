<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
    <style> 
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        form {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Edit User</h1>
    <form action="/edit/{{ user[0] }}" method="POST">
        <h2>{{user[0]}}</h2>
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" value="{{ user[1] }}" required><br><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" value="{{ user[2] }}" required><br><br>
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" value="{{ user[3] }}" required><br><br>
        
        <input type="submit" value="Update">
    </form>
</body>
</html>
